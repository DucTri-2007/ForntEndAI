<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3 - Kiểm tra mật khẩu</title>
</head>
<body>
    <h2>Bài 3: Kiểm tra mật khẩu</h2>
    <label for="password">Nhập mật khẩu:</label>
    <input type="password" id="password">
    <button onclick="checkPassword()">Kiểm tra</button>
    <p id="result"></p>
    <script>
        function checkPassword() {
            let pass = document.getElementById("password").value;
            let resultText = "";
            if (pass === "") {
                resultText = "Vui lòng không để trống mật khẩu!";
                document.getElementById("result").style.color = "red";
            } else if (pass.length < 8) {
                resultText = "Mật khẩu yếu! Cần ít nhất 8 ký tự.";
                document.getElementById("result").style.color = "red";
            } else {
                resultText = "Mật khẩu hợp lệ và an toàn!";
                document.getElementById("result").style.color = "green";
            }
            document.getElementById("result").innerHTML = resultText;
        }
    </script>
</body>
</html>
