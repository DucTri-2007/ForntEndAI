<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1 - Đổi màu nền</title>
</head>
<body>
    <h2>Bài 1: Đổi màu nền</h2>
    <button onclick="changeBackgroundColor('red')">Đỏ</button>
    <button onclick="changeBackgroundColor('lightblue')">Xanh dương</button>
    <button onclick="changeBackgroundColor('yellow')">Vàng</button>
    <button onclick="changeBackgroundColor('white')">Trắng (Mặc định)</button>
    <script>
        function changeBackgroundColor(color) {
            document.body.style.backgroundColor = color;
        }
    </script>
</body>
</html>
